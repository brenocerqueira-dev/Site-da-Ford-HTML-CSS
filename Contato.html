<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford|Contato</title>
    <link rel="stylesheet" href="css/Contato.css">
    <link rel="icon" href="img/large-ford-logo-0.png" type="image/png">
</head>

<body>

    <header class="cabecalho">
        <section class="Logo_da_Ford">
            <a href="index.html"><img class="logo-ford-256" src="img/logo-ford-256.png" alt="Logo da Ford"></a>
        </section>


        <nav class="Navegamento">
            <a href="index.html">Home</a>
            <a href="Lançamento.html">Lançamento</a>
            <a href="Contato.html">Contato</a>
        </nav>
    </header>

    <main class="container">


        <div class="imagem"><!-- IMAGEM -->
            <img src="img/xls 2.2 diesel.jpg" alt="XLS 2.2 Diesel 4X4 AT 2022">
        </div>


        <form class="formulario" onsubmit="event.preventDefault(); Post(this); Enviar();this.reset();">
            <h2>Sobre Você</h2>

            <input type="text" id="nomeid" name="nome" placeholder="Nome" required pattern="[A-Za-zÀ-ÿ\s]+"
                title="O nome deve conter apenas letras.">
            <!--Essa gosma vai Permitir apenas letras (A-Z), letras com acentos (À-ÿ) e espaços-->

            <input type="text" id="sobrenomeid" name="sobrenome" placeholder="Sobrenome" required
                pattern="[A-Za-zÀ-ÿ\s]+" title="O sobrenome deve conter apenas letras.">

            <input type="email" name="email" placeholder="E-mail" required>

            <input type="text" name="cpf" placeholder="CPF" inputmode="numeric" pattern="\d*"
                title="Digite apenas números">

            <input type="text" name="telefone" placeholder="Telefone" inputmode="numeric" pattern="\d*"
                title="Digite apenas números">


            <select name="contato" required>
                <option value="">Tipo de contato</option>
                <option value="Elogio">Elogio</option>
                <option value="Reclamação">Reclamação</option>
                <option value="Sugestão">Sugestão</option>

            </select>
           <textarea name="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>
            
            <p class="Termos_Condicoes">
                Os dados serão mantidos em nossa base de dados, só enquanto for desejado por você. A
                qualquer momento, será possível editar ou remover tais dados.
            </p>
            <div class="checkbox-linha">
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Sim. Li e concordo com os <a href="https://www.ford.com.br/politica-de-privacidade/" target="_blank">Termos e Condições</a>.</label>
            </div>
            <div class="checkbox-linha">
                <input type="checkbox" id="descontos" name="descontos">
                <label for="descontos">Sim. Também quero receber descontos e novidades.</label>
            </div>
            <button type="submit" id="btnEnviar" disabled>Enviar</button>
        </form>

    </main>

    <script src="js/form.js"></script>

    <footer class="Rodape">
        <div class="RedesSociais">
            <p>
                Redes sociais:
            </p>

            <a href="https://www.facebook.com/FordBrasil" target="_blank">
                <img src="img/facebook-50.png" alt="Logo do faceboobk da Ford" width=50; height="auto">
            </a>
            <a href="https://www.youtube.com/@fordbrasil" target="_blank">
                <img src="img/youtube-squared-50.png" alt="Youtube da Ford Brasil" width=50; height="auto">
            </a>
            <a href="https://www.instagram.com/fordbrasil/" target="_blank">
                <img src="img/instagram-logo-50.png" alt="instagram da Ford Brasil" width=50; height="auto">
            </a>

        </div>
        <p class="copyright">
            ©️ 2026 Ford Brasil | Viva o Novo. Todos os direitos reservados.
        </p>
        <div class="LogoRodape">
            <img src="img/ford-96.png" alt="Logo da Ford Canto">
        </div>
    </footer>

</body>

</html>
